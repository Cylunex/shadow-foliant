name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shadow_stock_test
          POSTGRES_USER: shadow_stock_test
          POSTGRES_PASSWORD: example-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shadow_stock_test -d shadow_stock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DATABASE: shadow_stock_test
      PG_USER: shadow_stock_test
      PG_PASSWORD: example-test-password
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_POSTGRES_INTEGRATION: "1"
      SHADOW_PLATFORM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: psql -f scripts/init_postgres.sql
        env:
          PGPASSWORD: example-test-password
          PGDATABASE: shadow_stock_test
          PGUSER: shadow_stock_test
          PGHOST: 127.0.0.1
      - run: python -m compileall -q .
      - run: bash -n scripts/deploy.sh
      - run: python -m pytest -q
