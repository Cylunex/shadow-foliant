version: 2
app_id: foliant
package_version: 0.5.0
skills:
  - id: foliant-security-research
    path: skills/foliant-security-research/SKILL.md
    summary: 读取正式证券研究事实，在缺失时创建可追踪且不发布的研究预览
    capabilities:
      - foliant.market.read
      - foliant.security-research.read
      - foliant.security-research.preview
      - foliant.run.read
    invocation: { model: true, user: true }
  - id: foliant-selection-audit
    path: skills/foliant-selection-audit/SKILL.md
    summary: 审计正式选股的来源、完整性和集中度，必要时建立不发布的选股预览
    capabilities:
      - foliant.market.read
      - foliant.selection.read
      - foliant.selection.preview
      - foliant.run.read
    invocation: { model: true, user: true }
  - id: foliant-backtest-review
    path: skills/foliant-backtest-review/SKILL.md
    summary: 建立并复核有费用、滑点和时间边界的回测预览
    capabilities:
      - foliant.backtest.preview
      - foliant.run.read
    invocation: { model: true, user: true }
  - id: foliant-personal-portfolio
    path: skills/foliant-personal-portfolio/SKILL.md
    summary: 读取个人持仓和成交，识别成交导入意图并生成 Nexus 成交 Proposal
    capabilities:
      - foliant.portfolio.read
      - foliant.trades.read
      - foliant.trades.draft
      - foliant.trades.write
    invocation: { model: true, user: true }
capabilities:
  - id: foliant.market.read
    summary: 读取 A 股市场会话、交易日和研究数据质量摘要
    audience: foliant
    scopes: [stock.read]
    tools:
      - name: foliant.market.overview
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_market_overview
        exposure: always
        result_mode: summary
        max_result_bytes: 65536
        max_model_chars: 5000
        timeout_ms: 12000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.market.data-quality
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_data_quality
        exposure: on-demand
        result_mode: summary
        max_result_bytes: 65536
        max_model_chars: 5000
        timeout_ms: 12000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.market.data-capabilities
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_data_capabilities
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 131072
        max_model_chars: 10000
        timeout_ms: 12000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: internal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: false
    idempotency_required: false
  - id: foliant.security-research.read
    summary: 读取一个证券已有的正式研究快照及其来源边界
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.security-research.latest
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_security_research_latest
        exposure: on-demand
        result_mode: summary
        max_result_bytes: 131072
        max_model_chars: 12000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.security-research.artifact-latest
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_research_artifact_latest
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 131072
        max_model_chars: 12000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: internal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: false
    idempotency_required: false
  - id: foliant.security-research.preview
    summary: 创建不写正式信号或研究快照的证券研究预览 Run
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.security-research.preview
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_security_research_run
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 2000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: internal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: false
    idempotency_required: true
  - id: foliant.selection.read
    summary: 读取最近正式 SelectionRun 和 manifest 绑定的候选摘要
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.selection.decision-loop
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_decision_loop
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 131072
        max_model_chars: 12000
        timeout_ms: 12000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.selection.latest
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_selection_run_latest
        exposure: on-demand
        result_mode: summary
        max_result_bytes: 131072
        max_model_chars: 12000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: internal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: false
    idempotency_required: false
  - id: foliant.selection.preview
    summary: 创建不替换最近正式选股结果的 Selection Preview Run
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.selection.preview
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_selection_run
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 2000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: internal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: false
    idempotency_required: true
  - id: foliant.backtest.preview
    summary: 创建有时间、费用和基准边界的异步回测预览 Run
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.backtest.preview
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_backtest_run
        exposure: on-demand
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 2000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: internal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: false
    idempotency_required: true
  - id: foliant.run.read
    summary: 查询当前 Agent 创建的 preview Run 状态和有界结果
    audience: foliant
    scopes: [stock.research]
    tools:
      - name: foliant.run.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_run
        exposure: on-demand
        result_mode: summary
        max_result_bytes: 32768
        max_model_chars: 4000
        timeout_ms: 8000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.run.result
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_run_result
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 262144
        max_model_chars: 16000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: internal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: false
    idempotency_required: false
  - id: foliant.portfolio.read
    summary: 读取已委托给 Nexus 的主组合持仓和成本口径摘要
    audience: foliant
    scopes: [stock.portfolio.read]
    tools:
      - name: foliant.portfolio.action-plan
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_account_action_plan
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 131072
        max_model_chars: 10000
        timeout_ms: 30000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.portfolio.books
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_account_books
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 131072
        max_model_chars: 10000
        timeout_ms: 12000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.portfolio.summary
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_portfolio_summary
        exposure: always
        result_mode: summary
        max_result_bytes: 131072
        max_model_chars: 8000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: foliant.trades.read
    summary: 按导入日期、成交日期或证券代码读取已委托主组合的成交记录
    audience: foliant
    scopes: [stock.portfolio.read]
    tools:
      - name: foliant.trades.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_trade_records
        exposure: on-demand
        result_mode: structured
        max_result_bytes: 262144
        max_model_chars: 12000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: foliant.trades.draft
    summary: 校验并暂存 Nexus 对话中明确要求导入的成交，不写入正式成交或持仓
    audience: foliant
    scopes: [stock.portfolio.write]
    tools:
      - name: foliant.nexus.review.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_nexus_foliant_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 131072
        max_model_chars: 1000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: sensitive
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
  - id: foliant.trades.write
    summary: 由 Nexus 隐藏 Host 将已校验成交 Review 幂等写入主组合并更新持仓
    audience: foliant
    scopes: [stock.portfolio.write]
    tools:
      - name: foliant.nexus.review.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_nexus_foliant_reviews
        exposure: hidden
        result_mode: reference
        max_result_bytes: 262144
        max_model_chars: 1000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
      - name: foliant.nexus.review.commit
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: commit_nexus_foliant_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 131072
        max_model_chars: 1000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
      - name: foliant.nexus.review.reject
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: reject_nexus_foliant_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 131072
        max_model_chars: 1000
        timeout_ms: 10000
        concurrency_safe: false
        retry_policy: idempotent
    effect: write
    data_classification: sensitive
    risk_level: L2
    confirmation: policy
    reversible: true
    resource_grant_required: true
    idempotency_required: true
