openapi: 3.1.0
info:
  title: Shadow Foliant Agent API
  version: 0.4.0
servers:
  - url: https://stock.example.com
security:
  - agentBearer: []
paths:
  /api/machine/v1/agent/market/overview:
    get:
      operationId: get_agent_market_overview
      summary: Read the current A-share market and trading-calendar overview
      responses:
        "200":
          description: Bounded market summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/market/data-quality:
    get:
      operationId: get_agent_data_quality
      summary: Read deterministic research-data quality and date alignment
      responses:
        "200":
          description: Data quality summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/market/data-capabilities:
    get:
      operationId: get_agent_data_capabilities
      summary: Read safe provider capability, quota, cooldown and dataset routing metadata
      responses:
        "200":
          description: Runtime data capability matrix
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/research-artifacts/latest:
    get:
      operationId: get_agent_research_artifact_latest
      summary: Read the latest append-only formal research artifact
      parameters:
        - name: subject
          in: query
          required: false
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Structured artifact or explicit missing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/securities/{symbol}/research/latest:
    get:
      operationId: get_agent_security_research_latest
      summary: Read the latest persisted formal research snapshot
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Formal research summary or an explicit missing result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/securities/{symbol}/research-runs:
    post:
      operationId: create_agent_security_research_run
      summary: Create a non-publishing security research preview Run
      description: Requires Idempotency-Key; the runtime supplies it outside model arguments.
      parameters:
        - $ref: "#/components/parameters/Symbol"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResearchPreviewCreate" }
      responses:
        "202":
          description: Persistent preview Run reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/selection-runs/latest:
    get:
      operationId: get_agent_selection_run_latest
      summary: Read the latest formal manifest-bound SelectionRun
      responses:
        "200":
          description: Formal selection summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/selection-runs:
    post:
      operationId: create_agent_selection_run
      summary: Create a Selection Preview that cannot replace formal selection
      description: Requires Idempotency-Key; external Wencai discovery does not affect preview scores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectionPreviewCreate" }
      responses:
        "202":
          description: Persistent preview Run reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/backtest-runs:
    post:
      operationId: create_agent_backtest_run
      summary: Create an asynchronous backtest preview
      description: Requires Idempotency-Key and never executes a broker transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestPreviewCreate" }
      responses:
        "202":
          description: Persistent preview Run reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/runs/{run_id}:
    get:
      operationId: get_agent_run
      summary: Read one preview Run owned by the authenticated Agent
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run lifecycle summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/machine/v1/agent/runs/{run_id}/result:
    get:
      operationId: get_agent_run_result
      summary: Read one bounded or paginated preview Run result
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Bounded tool result with optional continuation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/portfolio/summary:
    get:
      operationId: get_agent_portfolio_summary
      summary: Read the delegated primary portfolio summary and bounded holdings
      responses:
        "200":
          description: Bounded personal portfolio summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/portfolio/trade-records:
    get:
      operationId: list_agent_trade_records
      summary: Read delegated portfolio trades by import date, trade date or security code
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 20 } }
        - { name: import_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: trade_date, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: timezone, in: query, required: false, schema: { type: string, default: Asia/Shanghai } }
      responses:
        "200":
          description: Bounded trade record list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/machine/v1/agent/nexus/reviews:
    get:
      operationId: list_nexus_foliant_reviews
      summary: List pending trade-import reviews owned by the Nexus Agent
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Standard Nexus review collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: create_nexus_foliant_review
      summary: Validate and stage a delegated trade import without writing trades
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NexusReviewCreate" }
      responses:
        "201":
          description: Standard pending Nexus review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/commit:
    post:
      operationId: commit_nexus_foliant_review
      summary: Commit exactly one staged and validated trade import
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        "200":
          description: Standard approved Nexus review with canonical receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/reject:
    post:
      operationId: reject_nexus_foliant_review
      summary: Reject one staged trade import without writing trades
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        "200":
          description: Standard rejected Nexus review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: Shadow Agent token for audience foliant
  parameters:
    Symbol:
      name: symbol
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]{6}$" }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{32}$" }
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: string, pattern: "^tb_[a-f0-9]{24}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
  schemas:
    Provenance:
      type: object
      additionalProperties: false
      required:
        - decision_at
        - market_as_of
        - financial_cutoff_at
        - universe_snapshot_id
        - input_manifest_id
        - policy_hash
        - code_revision
        - run_id
      properties:
        decision_at: { type: string, nullable: true }
        market_as_of: { type: string, nullable: true }
        financial_cutoff_at: { type: string, nullable: true }
        universe_snapshot_id: { type: string, nullable: true }
        input_manifest_id: { type: string, nullable: true }
        policy_hash: { type: string, nullable: true }
        code_revision: { type: string, nullable: true }
        run_id: { type: string, nullable: true }
    ToolResult:
      type: object
      additionalProperties: false
      required: [summary, resource_uri, status, provenance, warnings, data]
      properties:
        summary: { type: string, maxLength: 2000 }
        resource_uri: { type: string, pattern: "^shadow://foliant/" }
        status: { enum: [complete, degraded, missing, failed] }
        provenance: { $ref: "#/components/schemas/Provenance" }
        warnings:
          type: array
          items: { type: string, maxLength: 500 }
        data: {}
        model_payload: {}
        continuation: { type: object, additionalProperties: true }
        derived_analysis: {}
    RunReference:
      type: object
      additionalProperties: false
      required: [run_id, status, mode, kind, resource_uri, run_resource_uri, cancellable]
      properties:
        run_id: { type: string }
        status: { enum: [queued, running, complete, failed, cancelled] }
        mode: { const: preview }
        kind: { enum: [security-research, selection, backtest] }
        resource_uri: { type: string, pattern: "^shadow://foliant/" }
        run_resource_uri: { type: string, pattern: "^shadow://foliant/runs/" }
        summary: { type: string }
        provenance: { type: object, additionalProperties: true }
        warnings: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        started_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        failed_at: { type: string, nullable: true }
        cancellable: { type: boolean }
        cancellation_note: { type: string }
        progress:
          type: array
          items: { type: object, additionalProperties: true }
    RunStatus:
      type: object
      additionalProperties: false
      required: [run_id, status, mode, kind, resource_uri, run_resource_uri, cancellable]
      properties:
        run_id: { type: string }
        status: { enum: [queued, running, complete, failed, cancelled] }
        mode: { const: preview }
        kind: { enum: [security-research, selection, backtest] }
        resource_uri: { type: string, pattern: "^shadow://foliant/" }
        run_resource_uri: { type: string, pattern: "^shadow://foliant/runs/" }
        summary: { type: string }
        provenance: { type: object, additionalProperties: true }
        warnings: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        started_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        failed_at: { type: string, nullable: true }
        cancellable: { type: boolean }
        cancellation_note: { type: string }
        progress:
          type: array
          items: { type: object, additionalProperties: true }
    ResearchPreviewCreate:
      type: object
      additionalProperties: false
      properties:
        depth: { enum: [quick, deep], default: quick }
    SelectionPreviewCreate:
      type: object
      additionalProperties: false
      properties:
        selection_date: { type: string, format: date, nullable: true }
        decision_mode: { enum: [preopen, postclose, historical_close], default: preopen }
    BacktestPreviewCreate:
      type: object
      additionalProperties: false
      required: [symbols]
      properties:
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, pattern: "^[0-9]{6}$" }
        strategy: { type: string, minLength: 1, maxLength: 80, default: enter }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        hold_days: { type: integer, minimum: 1, maximum: 250, default: 10 }
        stop_pct: { type: number, minimum: 0, maximum: 100, default: 8 }
        target_pct: { type: number, minimum: 0, maximum: 500, default: 15 }
        max_positions: { type: integer, minimum: 1, maximum: 20, default: 5 }
        benchmark: { type: string, pattern: "^[0-9]{6}$", default: "000300" }
    NexusReviewCreate:
      type: object
      additionalProperties: false
      required: [intent, summary, fields]
      properties:
        intent: { const: foliant.trade.import }
        summary: { type: string, minLength: 1, maxLength: 500 }
        fields:
          type: object
          additionalProperties: true
          description: Contains trades or tradesJson, and optional updatePosition
        source_text: { type: string, maxLength: 12000, default: "" }
        source_refs:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 500 }
    ReviewDecision:
      type: object
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1, nullable: true }
    ReviewEnvelope:
      type: object
      additionalProperties: false
      required: [protocol, review_id, reference, revision, domain, intent, summary, fields, risk_level, state, created_at, source_refs, trace_id, receipt, replayed]
      properties:
        protocol: { const: shadow.review.v1 }
        review_id: { type: string }
        reference: { type: string, pattern: "^shadow://foliant/trade-imports/" }
        revision: { type: integer, minimum: 1 }
        domain: { const: foliant }
        intent: { const: foliant.trade.import }
        summary: { type: string }
        fields: { type: object, additionalProperties: true }
        risk_level: { const: L2 }
        state: { enum: [pending, approved, rejected, failed] }
        created_at: { type: string }
        source_refs: { type: array, items: { type: string } }
        trace_id: { type: string }
        receipt: { type: [string, "null"] }
        replayed: { type: boolean }
    ReviewCollection:
      type: object
      additionalProperties: false
      required: [protocol, items]
      properties:
        protocol: { const: shadow.review.v1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewEnvelope" }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [ok, error]
      properties:
        ok: { const: false }
        error:
          oneOf:
            - { type: string }
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid Agent Bearer
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Audience or required scope is not authorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource is absent or not owned by this Agent
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Idempotency conflict or Run is not complete
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
